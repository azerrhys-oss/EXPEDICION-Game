<style>
/* Layout: mundo explorable (canvas) como pantalla principal + paneles. Look único y claro, a propósito. */
:root{
  --sea:#0f5c6e; --sea-deep:#0a3d4a; --foam:#e6f4f1; --sand:#fbf3e2; --paper:#fffdf8;
  --coral:#f0705a; --sun:#f7c548; --leaf:#4f9d69; --ink:#1d2b33; --ink-soft:#4b5d66; --line:#d9cfbb; --lav:#8a7fd1; --crystal:#7fd4e8;
  --f-display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", Verdana, system-ui, sans-serif;
  --scale:1; color-scheme: light;
}
html,body{height:100%}
body{background:var(--sea);color:var(--ink);font-family:var(--f-body);font-size:calc(18px * var(--scale));line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:0;overscroll-behavior:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sea-deep)}
*{box-sizing:border-box}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.app{max-width:900px;margin:0 auto;padding-block:12px 96px;display:flex;flex-direction:column;gap:14px}
.app.world{padding-block:8px 84px;gap:8px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--foam)}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.35em;line-height:1.1}
.brand small{display:block;font-family:var(--f-body);font-weight:400;font-size:.62em;opacity:.85}
.who{display:flex;align-items:center;gap:8px;font-size:.85em}
.who svg{width:44px;height:44px;background:var(--foam);border-radius:50%}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--sea-deep);display:flex;justify-content:center;gap:4px;
  padding:6px max(16px, env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px))}
nav.tabs button{flex:1;max-width:170px;background:transparent;border:0;color:var(--foam);border-radius:14px;padding:4px;font-size:.74em;display:flex;flex-direction:column;align-items:center;gap:1px}
nav.tabs button[aria-current="true"]{background:var(--foam);color:var(--sea-deep);font-weight:700}
nav.tabs svg{width:24px;height:24px}
.card{background:var(--paper);border-radius:22px;padding:20px;box-shadow:0 6px 0 var(--sea-deep)}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:1.6em;font-weight:800} h2{font-size:1.3em;font-weight:700} h3{font-size:1.1em;font-weight:700}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.eyebrow{font-size:.72em;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);font-weight:700}
.btn{border:0;border-radius:16px;padding:10px 18px;font-weight:700;background:var(--sea);color:#fff;min-height:52px;box-shadow:0 4px 0 var(--sea-deep);font-family:var(--f-display);font-size:1.05em}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--sea-deep)}
.btn.sun{background:var(--sun);color:var(--ink);box-shadow:0 4px 0 #c99a25}
.btn.coral{background:var(--coral);box-shadow:0 4px 0 #b9493a}
.btn.ghost{background:transparent;color:var(--sea);box-shadow:inset 0 0 0 2px var(--sea)}
.btn.small{min-height:40px;padding:6px 12px;font-size:.9em}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.next{align-self:flex-end}
.say{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.say .face svg{width:72px;height:72px}
.bubble{background:#fff;border:2px solid var(--line);border-radius:18px;padding:10px 12px;min-width:0;display:flex;gap:8px;align-items:flex-start}
.bubble .txt{flex:1;min-width:0}
.bubble .name{font-family:var(--f-display);font-weight:700;color:var(--sea);font-size:.9em;display:block}
.speak{flex:none;border:0;background:var(--foam);color:var(--sea);border-radius:50%;width:40px;height:40px;display:grid;place-items:center}
.speak svg{width:22px;height:22px}
.speak.on{background:var(--sun);color:var(--ink)}
.result{border-radius:18px;padding:14px;background:var(--sand);border:2px dashed var(--line)}
.tag{display:inline-block;font-size:.75em;font-weight:700;border-radius:999px;padding:2px 10px;background:var(--foam);color:var(--sea-deep);align-self:flex-start}
.tag.sci{background:#e3f0ff;color:#1f4f8a}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;min-height:44px}
.chip.sel{background:var(--sea);color:#fff;border-color:var(--sea)}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.scard{border:2px solid var(--line);background:#fff;border-radius:16px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:104px}
.scard b{font-family:var(--f-display);font-size:1.05em}
.scard small{color:var(--ink-soft);font-size:.8em;line-height:1.3}
.scard.sel{border-color:var(--leaf);background:#e7f5ea;box-shadow:inset 0 0 0 2px var(--leaf)}
.scard .ic{font-size:1.6em;line-height:1}
.portbtn{display:flex;gap:12px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:18px;padding:10px 12px;text-align:left;width:100%}
.portbtn .dot{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;color:#fff;flex:none;font-size:1.2em}
.portbtn .meta{flex:1;min-width:0}
.portbtn small{color:var(--ink-soft);display:block}
.locked{opacity:.55}
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.stamp{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:.72em;font-weight:700;line-height:1.15}
.stamp span{width:58px;height:58px;border-radius:50%;border:3px dashed currentColor;display:grid;place-items:center;font-size:1.9em;transform:rotate(-8deg)}
.stamp.off{opacity:.3;filter:grayscale(1)}
.lab-steps{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:8px}
.check{display:flex;gap:10px;align-items:center;min-height:44px}
.check input{width:24px;height:24px;accent-color:var(--leaf)}
.warn{background:#fff1cc;border-radius:14px;padding:10px 12px;font-size:.9em}
.bars{display:flex;gap:14px;align-items:flex-end;height:180px;padding:10px;border-bottom:2px solid var(--ink-soft)}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;min-width:0}
.bar i{display:block;width:100%;max-width:70px;border-radius:10px 10px 0 0;background:var(--coral)}
.bar b{font-variant-numeric:tabular-nums}
.bar small{font-size:.75em;text-align:center}
input[type=number],input[type=text],textarea,select{font:inherit;border:2px solid var(--line);border-radius:12px;padding:10px;background:#fff;color:var(--ink);width:100%;min-height:48px}
textarea{min-height:90px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:.9em}
.canvaswrap{border:2px solid var(--line);border-radius:14px;background:#fff;overflow:hidden;touch-action:none}
.canvaswrap canvas{display:block;width:100%;height:auto}
.body-map{display:grid;grid-template-columns:minmax(0,170px) 1fr;gap:12px;align-items:start}
.body-map svg{width:100%;height:auto}
.zone{fill:#f3e6d3;stroke:var(--ink-soft);stroke-width:2;cursor:pointer}
.thermo{display:flex;flex-direction:column;gap:6px}
input[type=range]{width:100%;accent-color:var(--coral);height:36px}
.toolcard{display:flex;gap:12px;align-items:center}
.toolcard .ic{font-size:2em;width:56px;height:56px;border-radius:16px;background:var(--foam);display:grid;place-items:center;flex:none}
.papa details{border-top:2px solid var(--line);padding-block:10px}
.papa summary{font-family:var(--f-display);font-weight:700;cursor:pointer;min-height:40px;display:flex;align-items:center}
.papa ul{margin:6px 0 0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.muted{color:var(--ink-soft);font-size:.88em}
.confirm{background:#ffe9e4;border-radius:14px;padding:12px}
.fade{animation:fade .25s ease-out}
@keyframes fade{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .3s}
/* acertijos */
.puzz{background:#0a3d4a;color:var(--foam);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:12px}
.puzz h3{color:var(--sun)}
.keygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px}
.keyb{background:#fffdf8;color:var(--ink);border:0;border-radius:12px;padding:4px;display:flex;flex-direction:column;align-items:center;min-height:62px;justify-content:center}
.keyb b{font-size:1.5em;line-height:1}
.keyb small{font-weight:700;font-family:var(--f-display);font-size:1em}
.slots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.slot{width:48px;min-height:70px;border-radius:12px;background:#ffffff1a;border:2px solid #ffffff44;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.slot.cur{border-color:var(--sun);background:#f7c54833}
.slot .sym{font-size:1.4em;line-height:1}
.slot .let{font-family:var(--f-display);font-weight:800;font-size:1.4em;color:var(--sun);min-height:1.2em;line-height:1.2}
.big-word{font-family:var(--f-display);font-weight:800;font-size:2.2em;letter-spacing:.12em;text-align:center;color:var(--sun)}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:320px;margin:0 auto;width:100%}
.numpad button{min-height:56px;border:0;border-radius:14px;background:#fffdf8;color:var(--ink);font-family:var(--f-display);font-weight:800;font-size:1.4em}
.numpad button.ok{background:var(--sun)}
.numshow{font-family:var(--f-display);font-weight:800;font-size:2.4em;text-align:center;background:#ffffff1a;border-radius:14px;min-height:64px;letter-spacing:.1em}
.dials{display:flex;gap:12px;justify-content:center}
.dial{display:flex;flex-direction:column;align-items:center;gap:4px}
.dial b{font-family:var(--f-display);font-size:2.4em;width:64px;height:72px;display:grid;place-items:center;background:#fffdf8;color:var(--ink);border-radius:14px}
.dial button{width:64px;height:40px;border:0;border-radius:12px;background:var(--sun);font-size:1.1em}
.cluechips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.cluechip{background:#ffffff1a;border-radius:999px;padding:6px 12px;font-weight:700}
.palette{display:flex;gap:10px;justify-content:center}
.palette button{width:54px;height:54px;border-radius:50%;border:3px solid #fffdf8}
.cslots{display:flex;gap:10px;justify-content:center}
.cslot{width:48px;height:48px;border-radius:50%;border:3px dashed #ffffff66}
.hist{display:flex;flex-direction:column;gap:6px}
.hrow{display:flex;gap:8px;align-items:center;justify-content:center;background:#ffffff12;border-radius:12px;padding:6px}
.hrow i{width:26px;height:26px;border-radius:50%;display:inline-block}
.hrow i.peg{width:14px;height:14px}
.screwgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.screwcard{background:#fffdf8;color:var(--ink);border:3px solid transparent;border-radius:14px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px}
.screwcard.tried{border-color:var(--coral)}
.screwcard.ok{border-color:var(--leaf)}
.screwcard svg{width:100%;height:auto}
.tiles{display:flex;justify-content:center;gap:4px}
.tile{width:84px;height:84px;background:#fffdf8;border:0;border-radius:12px;padding:0}
.tile span{display:block;width:100%;height:100%;transition:transform .2s}
.tile svg{width:100%;height:100%}
.crystal{width:120px;height:120px;margin:0 auto;animation:spin 3s linear infinite;filter:drop-shadow(0 0 14px #7fd4e8)}
@keyframes spin{from{transform:rotateY(0)}to{transform:rotateY(360deg)}}

/* ===== Mundo ===== */
.stage{position:relative;border-radius:20px;overflow:hidden;box-shadow:0 6px 0 var(--sea-deep);background:#2f8fb0;touch-action:none;user-select:none;-webkit-user-select:none}
.stage canvas{display:block;width:100%;height:100%}
.hud{position:absolute;top:8px;left:8px;right:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start;pointer-events:none}
.hud>*{pointer-events:auto}
.hud .sp{flex:1}
.hud .place,.hud .frags{background:#0a3d4acc;color:var(--foam);border-radius:14px;padding:4px 10px;font-family:var(--f-display);font-weight:700;font-size:.85em;line-height:1.2}
.hud .frags{color:var(--crystal);font-weight:800}
.hud .goal{order:3;flex-basis:100%;min-width:0;background:#fffdf8ee;border-radius:14px;padding:4px 10px;font-size:.82em;font-weight:700;line-height:1.3;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hud .det{font-size:.95em;font-weight:700;color:var(--sea-deep);white-space:nowrap}
.hud .det i{display:inline-block;width:6px;margin-left:2px;border-radius:2px;background:#c9d3d6;vertical-align:bottom}
.hud .det i.on{background:var(--coral)}
.hud .ib{flex:none;width:42px;height:42px;border-radius:14px;border:0;background:#fffdf8ee;font-size:1.25em;display:grid;place-items:center;box-shadow:0 3px 0 #0a3d4a55}
.toast{position:absolute;left:50%;top:104px;transform:translateX(-50%);background:var(--sun);color:var(--ink);font-weight:700;border-radius:999px;padding:6px 16px;font-size:.9em;box-shadow:0 4px 0 #c99a25;pointer-events:none;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis;animation:pop .3s ease-out}
@keyframes pop{from{transform:translateX(-50%) scale(.6);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
.hint-move{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:#0a3d4acc;color:var(--foam);border-radius:999px;padding:4px 14px;font-size:.8em;pointer-events:none;white-space:nowrap}
.dlg{position:absolute;left:8px;right:8px;bottom:8px;background:var(--paper);border-radius:20px;padding:10px 12px 12px;box-shadow:0 5px 0 var(--sea-deep);display:flex;flex-direction:column;gap:8px;max-height:76%;overflow:auto;animation:fade .2s ease-out}
.dlg .say .face svg{width:64px;height:64px}
.dclose,.pclose{border:0;background:var(--foam);color:var(--sea-deep);border-radius:999px;padding:4px 12px;font-weight:700;font-size:.85em;min-height:36px;align-self:flex-end}
.dlg-opts{display:flex;flex-direction:column;gap:8px}
.dopt{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:6px 10px;min-height:56px;width:100%;text-align:left}
.dopt:hover{border-color:var(--sea)}
.dopt .ic{font-size:1.6em;width:40px;text-align:center;flex:none}
.dopt .t{flex:1}
.dopt.tried{background:var(--foam)}
.panel{position:absolute;inset:0;background:#0a3d4a88;display:flex;align-items:flex-end;justify-content:center;padding:8px;overflow:auto;animation:fade .2s ease-out}
.panel>.card{width:100%;max-width:640px;max-height:100%;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
@media (prefers-reduced-motion:reduce){.fade,.dlg,.panel,.toast,.crystal,.shake{animation:none}}
@media (max-width:480px){.say .face svg{width:56px;height:56px}.body-map{grid-template-columns:1fr}.body-map svg{max-width:180px;margin:0 auto}.tile{width:72px;height:72px}}
</style>

<div class="app" id="app" aria-live="polite"></div>
<nav class="tabs" id="tabs" hidden></nav>

<script>
(function(){
'use strict';
/* ================= Estado ================= */
var KEY='curiosa_v1';
var DEF={alias:'',avatar:{skin:1,hair:0,shirt:0,hat:0,glasses:false,style:0,eye:0},
  settings:{autoRead:true,voiceURI:'',voiceURIm:'',rate:0.95,scale:1,sfx:true},
  mods:{},tools:[],world:{v:3,scene:'isla',intro:false,found:[],seenUnlock:[],finale:false}};
var S=load();
function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);
   if(!o.world||o.world.v!==3){o={alias:o.alias,avatar:o.avatar,settings:o.settings};} // la trama nueva arranca de cero; se conservan avatar y ajustes
   return merge(JSON.parse(JSON.stringify(DEF)),o);}}catch(e){}
  var h=window.claude&&window.claude.hot&&window.claude.hot.data; if(h&&h.state)return h.state;
  return JSON.parse(JSON.stringify(DEF));}
function merge(a,b){for(var k in b){if(b[k]===undefined)continue;if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==='object')merge(a[k],b[k]);else a[k]=b[k];}return a;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function M(id){if(!S.mods[id])S.mods[id]={done:false,stamps:{probe:0,change:0,lab:0,crew:0,reflect:0},cards:[],cardWhen:{},journal:null,lab:{pred:null,result:null},q:{s:0}};
  if(!S.mods[id].q)S.mods[id].q={s:0};return S.mods[id];}
function frags(){return ['m1','m2','m3'].filter(function(k){return S.mods[k]&&S.mods[k].q&&S.mods[k].q.frag;}).length;}
try{if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(function(){return {state:S};});}catch(e){}
document.documentElement.style.setProperty('--scale',S.settings.scale||1);

/* ================= Voz ================= */
var synth=window.speechSynthesis||null, voices=[], interacted=false, speakingBtn=null, speakGen=0;
var FEM=['paulina','mónica','monica','helena','sabina','laura','elvira','dalia','lucia','lucía','marisol','paloma','elena','camila','valentina','isabela','soledad','ximena','angelica','angélica','esperanza','francisca','female','mujer','sfb','eea','eec','eee','esc'];
var MAS=['jorge','diego','carlos','pablo','juan','raul','raúl','alvaro','álvaro','enrique','gonzalo','andrés','andres','tomás','tomas','male','hombre','eed','eef','sfd','esd'];
function loadVoices(){if(!synth)return;voices=synth.getVoices().filter(function(v){return /^es/i.test(v.lang);});}
if(synth){loadVoices();if(synth.onvoiceschanged!==undefined)synth.onvoiceschanged=function(){loadVoices();if(view.name==='papa')render();};}
function femScore(v){var n=(v.name+' '+v.voiceURI).toLowerCase(),s=0;FEM.forEach(function(f){if(n.indexOf(f)>-1)s+=4;});MAS.forEach(function(m){if(n.indexOf(m)>-1)s-=6;});return s;}
function baseScore(v){var n=(v.name+' '+v.voiceURI).toLowerCase(),s=0;if(/es[-_](ar|419|us|mx|uy|cl|co)/i.test(v.lang))s+=3;else if(/es[-_]es/i.test(v.lang))s+=1;if(/google|neural|natural|premium|enhanced|online/.test(n))s+=3;if(/compact|espeak/.test(n))s-=4;return s;}
function bestVoice(){if(!voices.length)loadVoices();if(!voices.length)return null;return voices.slice().sort(function(a,b){return (baseScore(b)+femScore(b))-(baseScore(a)+femScore(a));})[0];}
